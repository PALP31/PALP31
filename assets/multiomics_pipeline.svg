<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2b38" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#06151e" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142347" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0a1226" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d1527" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#150a14" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2e24" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#061913" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowTeal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 20px; fill: #ffffff; letter-spacing: 0.5px; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #00e5bc; font-weight: 600; letter-spacing: 1.5px; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 15px; }
      .card-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 11px; fill: #94a3b8; }
      .badge-text { font-family: 'SF Mono', Consolas, Monaco, monospace; font-size: 10px; font-weight: 600; }
      .desc-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #cbd5e1; line-height: 1.4; }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="950" height="360" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header Section -->
  <g transform="translate(30, 38)">
    <circle cx="10" cy="10" r="10" fill="#00e5bc" opacity="0.2" filter="url(#glowTeal)" />
    <circle cx="10" cy="10" r="4" fill="#00e5bc" />
    <text x="32" y="7" class="subtitle">MULTI-OMICS &amp; BIOINFORMATICS RESEARCH FRAMEWORK</text>
    <text x="32" y="27" class="title">Integrative Stress Physiology in Durum Wheat (Triticum durum)</text>
  </g>

  <!-- Connector Lines Behind Cards -->
  <path d="M 230 185 L 260 185 M 460 185 L 490 185 M 690 185 L 720 185" stroke="#334155" stroke-dasharray="4,4" stroke-width="2" />
  
  <!-- Flow Arrow Icons -->
  <polygon points="252,181 258,185 252,189" fill="#00e5bc" />
  <polygon points="482,181 488,185 482,189" fill="#4dadf7" />
  <polygon points="712,181 718,185 712,189" fill="#ff6b6b" />

  <!-- ================= CARD 1: IONOMICS ================= -->
  <g transform="translate(30, 85)">
    <rect width="200" height="235" rx="10" fill="url(#cardGrad1)" stroke="#00e5bc" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="28" cy="28" r="14" fill="#00e5bc" fill-opacity="0.15" />
    <text x="28" y="33" text-anchor="middle" font-size="14">⚡</text>
    
    <text x="50" y="25" class="card-title" fill="#00e5bc">Ionomics</text>
    <text x="50" y="39" class="card-sub">Elemental Profiling</text>

    <line x1="20" y1="52" x2="180" y2="52" stroke="#1e3a47" stroke-width="1" />

    <!-- Badges -->
    <rect x="20" y="62" width="75" height="18" rx="4" fill="#00e5bc" fill-opacity="0.15" />
    <text x="57" y="74" text-anchor="middle" class="badge-text" fill="#00e5bc">K⁺ / Na⁺ Ratio</text>
    <rect x="100" y="62" width="78" height="18" rx="4" fill="#00e5bc" fill-opacity="0.15" />
    <text x="139" y="74" text-anchor="middle" class="badge-text" fill="#00e5bc">ICP-OES / MS</text>

    <!-- Description -->
    <text x="20" y="105" class="desc-text">• Mineral homeostasis</text>
    <text x="20" y="125" class="desc-text">• Root Na⁺/K⁺ exclusion</text>
    <text x="20" y="145" class="desc-text">• Vacuolar compartmentalization</text>
    <text x="20" y="165" class="desc-text">• HKT / SOS transporters</text>

    <!-- Bottom Tag -->
    <rect x="20" y="195" width="160" height="22" rx="5" fill="#031a24" stroke="#00e5bc" stroke-opacity="0.2" />
    <text x="100" y="210" text-anchor="middle" class="badge-text" fill="#5eead4">Flux Balance Models</text>
  </g>

  <!-- ================= CARD 2: TRANSCRIPTOMICS ================= -->
  <g transform="translate(260, 85)">
    <rect width="200" height="235" rx="10" fill="url(#cardGrad2)" stroke="#4dadf7" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="28" cy="28" r="14" fill="#4dadf7" fill-opacity="0.15" />
    <text x="28" y="33" text-anchor="middle" font-size="14">🧬</text>
    
    <text x="50" y="25" class="card-title" fill="#4dadf7">Transcriptomics</text>
    <text x="50" y="39" class="card-sub">RNA-seq &amp; Gene Expression</text>

    <line x1="20" y1="52" x2="180" y2="52" stroke="#1c2f59" stroke-width="1" />

    <!-- Badges -->
    <rect x="20" y="62" width="70" height="18" rx="4" fill="#4dadf7" fill-opacity="0.15" />
    <text x="55" y="74" text-anchor="middle" class="badge-text" fill="#4dadf7">DESeq2</text>
    <rect x="95" y="62" width="85" height="18" rx="4" fill="#4dadf7" fill-opacity="0.15" />
    <text x="137" y="74" text-anchor="middle" class="badge-text" fill="#4dadf7">WGCNA Net</text>

    <!-- Description -->
    <text x="20" y="105" class="desc-text">• Differential expression (DEGs)</text>
    <text x="20" y="125" class="desc-text">• Co-expression networks</text>
    <text x="20" y="145" class="desc-text">• HSF, WRKY, bZIP TFs</text>
    <text x="20" y="165" class="desc-text">• HSPs &amp; thermotolerance</text>

    <!-- Bottom Tag -->
    <rect x="20" y="195" width="160" height="22" rx="5" fill="#081530" stroke="#4dadf7" stroke-opacity="0.2" />
    <text x="100" y="210" text-anchor="middle" class="badge-text" fill="#93c5fd">BioConductor Workflows</text>
  </g>

  <!-- ================= CARD 3: METABOLOMICS ================= -->
  <g transform="translate(490, 85)">
    <rect width="200" height="235" rx="10" fill="url(#cardGrad3)" stroke="#ff6b6b" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="28" cy="28" r="14" fill="#ff6b6b" fill-opacity="0.15" />
    <text x="28" y="33" text-anchor="middle" font-size="14">🧪</text>
    
    <text x="50" y="25" class="card-title" fill="#ff6b6b">Metabolomics</text>
    <text x="50" y="39" class="card-sub">Redox &amp; Compatible Solutes</text>

    <line x1="20" y1="52" x2="180" y2="52" stroke="#4a1e2f" stroke-width="1" />

    <!-- Badges -->
    <rect x="20" y="62" width="75" height="18" rx="4" fill="#ff6b6b" fill-opacity="0.15" />
    <text x="57" y="74" text-anchor="middle" class="badge-text" fill="#ff6b6b">ROS Defense</text>
    <rect x="100" y="62" width="80" height="18" rx="4" fill="#ff6b6b" fill-opacity="0.15" />
    <text x="140" y="74" text-anchor="middle" class="badge-text" fill="#ff6b6b">Osmolytes</text>

    <!-- Description -->
    <text x="20" y="105" class="desc-text">• Osmotic adjustment (Proline)</text>
    <text x="20" y="125" class="desc-text">• SOD, CAT, APX enzymes</text>
    <text x="20" y="145" class="desc-text">• Lipid peroxidation (MDA)</text>
    <text x="20" y="165" class="desc-text">• Secondary metabolites</text>

    <!-- Bottom Tag -->
    <rect x="20" y="195" width="160" height="22" rx="5" fill="#240a16" stroke="#ff6b6b" stroke-opacity="0.2" />
    <text x="100" y="210" text-anchor="middle" class="badge-text" fill="#fca5a5">Biochemical Phenotyping</text>
  </g>

  <!-- ================= CARD 4: DATA INTEGRATION & PIECEWISE SEM ================= -->
  <g transform="translate(720, 85)">
    <rect width="200" height="235" rx="10" fill="url(#cardGrad4)" stroke="#2ecc71" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="28" cy="28" r="14" fill="#2ecc71" fill-opacity="0.15" />
    <text x="28" y="33" text-anchor="middle" font-size="14">📊</text>
    
    <text x="50" y="25" class="card-title" fill="#2ecc71">Integration &amp; SEM</text>
    <text x="50" y="39" class="card-sub">Piecewise SEM &amp; Bayes</text>

    <line x1="20" y1="52" x2="180" y2="52" stroke="#17442d" stroke-width="1" />

    <!-- Badges -->
    <rect x="20" y="62" width="72" height="18" rx="4" fill="#2ecc71" fill-opacity="0.15" />
    <text x="56" y="74" text-anchor="middle" class="badge-text" fill="#2ecc71">brms / Stan</text>
    <rect x="96" y="62" width="84" height="18" rx="4" fill="#2ecc71" fill-opacity="0.15" />
    <text x="138" y="74" text-anchor="middle" class="badge-text" fill="#2ecc71">Piecewise SEM</text>

    <!-- Description -->
    <text x="20" y="105" class="desc-text">• Bayesian Inference (MCMC)</text>
    <text x="20" y="125" class="desc-text">• Multi-block sPLS-DA (DIABLO)</text>
    <text x="20" y="145" class="desc-text">• Mixed Models (LMM/GLMM)</text>
    <text x="20" y="165" class="desc-text">• Piecewise SEM (Causality)</text>

    <!-- Bottom Tag -->
    <rect x="20" y="195" width="160" height="22" rx="5" fill="#041a12" stroke="#2ecc71" stroke-opacity="0.2" />
    <text x="100" y="210" text-anchor="middle" class="badge-text" fill="#86efac">Bayesian &amp; Structural AI</text>
  </g>
</svg>
